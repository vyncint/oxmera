[package]
name = "oxmera-cli"
description = "The oxmera terminal surface: `oxmera doctor` reports toolchain, tier availability, and ladder progress. Skeleton framework, real doctor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "oxmera"
path = "src/main.rs"
# The bin shares its name with the umbrella lib crate; documenting both
# would collide in target/doc/oxmera/. The lib's docs win.
doc = false

[dependencies]
serde.workspace = true
toml.workspace = true

[dev-dependencies]
termlens = "0.5"
