[package]
name = "oxmera-cli"
description = "The oxmera terminal surface: `oxmera doctor` hardware/capability reports and `oxmera train --tui`, the live training dashboard, PTY-tested with termlens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "oxmera"
path = "src/main.rs"
# The bin shares its name with the umbrella lib crate; documenting both
# would collide in target/doc/oxmera/. The lib's docs win.
doc = false

[dependencies]
oxmera.workspace = true
crossterm = "0.29"
ratatui = "0.30.0"
serde.workspace = true
toml.workspace = true

# Already in the tree via crossterm <- ratatui, at this version. Naming it
# here is an import, not a new dependency: no new third-party code and no
# new licence. Unix only — Windows has no POSIX signals (see src/restore.rs).
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"


[dev-dependencies]
termlens = "0.9"
