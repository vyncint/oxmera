# Environment shape 3: a Linux box with a CUDA toolkit visible (the tier-2
# box, or a workstation). Doctor still marks tier 2 as metered — presence
# of a toolkit is not permission to spend.
os = "linux"
arch = "x86_64"
ladder_found = true

[toolchain]
rustc = "rustc 1.97.1 (fixture)"
cargo = "cargo 1.97.1 (fixture)"
just = "just 1.58.0"
reconverge = "cargo-reconverge 0.3.0"
launchbound = "launchbound 1.2.0"
container = false

[gpu]
metal = false
cuda = true

[[ladder]]
id = "b1"
name = "first kernel"
status = "solved"

[[ladder]]
id = "d2"
name = "run and measure"
status = "planned"
