# Environment shape 1: a bare CI runner — no GPU, no Metal, no container,
# no gate tools. The shape `ci.yml` itself runs doctor in.
os = "linux"
arch = "x86_64"
ladder_found = true

[toolchain]
rustc = "rustc 1.97.1 (fixture)"
cargo = "cargo 1.97.1 (fixture)"
just = "just 1.58.0"
container = false

[gpu]
metal = false
cuda = false

