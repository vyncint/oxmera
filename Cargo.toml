[workspace]
resolver = "3"
members = ["crates/oxmera"]
# The GPU/compiler research layer is a separate workspace on a pinned
# nightly (see research/rust-toolchain.toml and ARCHITECTURE.md).
exclude = ["research"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vyncint/oxmera"
authors = ["Vyncint Ng <vyncint@icloud.com>"]
