# The convergence gate: the GPU-correctness thesis, proven on plain
# runners with no GPU. Two legs over research/oxmera-cuda-oxide:
#
#   1. `cargo reconverge check --strict` — static barrier and
#      warp-collective convergence, zero findings tolerated;
#   2. `launchbound prune` at both supported compute capabilities —
#      every candidate in kernel.toml's launch space must be admitted
#      (the space deliberately contains no invalid configuration; an
#      unexpected refusal is a regression in the kernels or the space).
#
# The reconverge-version and toolchain inputs pin the measured pairing
# (docs/research-baseline.md); a pin bump must touch this file.

name: convergence-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconverge-strict:
    name: reconverge strict (cuda kernels)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Pinned nightly with driver components
        run: rustup toolchain install nightly-2026-04-03 --profile minimal --component rustfmt,clippy,rust-src,rustc-dev,llvm-tools
      - name: Install pinned reconverge (both binaries, same version)
        run: |
          cargo +nightly-2026-04-03 install --locked cargo-reconverge --version 0.5.0
          cargo +nightly-2026-04-03 install --locked reconverge-driver --version 0.5.0
      - name: Strict convergence check, per-part context for both targets
        working-directory: research/oxmera-cuda-oxide
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-04-03
        run: |
          set -euo pipefail
          cargo reconverge check --strict --cc 7.5
          cargo reconverge check --strict --cc 8.6

  prune:
    name: launchbound prune (cc ${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: ["7.5", "8.6"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Safety gate over the kernel launch space
        id: gate
        uses: vyncint/launchbound/action@5381fc1c804ea54fab4aef6c1aac3d336cdebe47 # v2.1.0
        with:
          kernel: research/oxmera-cuda-oxide
          cc: ${{ matrix.cc }}
          fail-on: refused
          reconverge-version: "0.5.0"
          toolchain: nightly-2026-04-03
      - name: Assert the whole space is admitted
        env:
          ADMITTED: ${{ steps.gate.outputs.admitted }}
          REFUSED: ${{ steps.gate.outputs.refused }}
        run: |
          set -euo pipefail
          echo "cc ${{ matrix.cc }}: admitted=$ADMITTED refused=$REFUSED"
          test "$ADMITTED" = "12"
          test "$REFUSED" = "0"
