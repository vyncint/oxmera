# The main CI gate: format, clippy -D warnings, tests, docs as errors,
# MSRV against the committed lockfile, the dependency firewall, and the
# exercise ladder — on ubuntu and macos, with no GPU anywhere. Tier-2
# hardware is never touched from CI.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace
        env:
          # Every screen a failing termlens wait carries is also written
          # here, so the `report` step below can put it in the job summary
          # instead of leaving it in a log someone has to scroll. With the
          # `serde` feature on the dev-dependency these are `.screen.json`
          # (termlens 0.10).
          TERMLENS_ARTIFACT_DIR: ${{ runner.temp }}/termlens
      - name: Docs are warning-free
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # A PTY failure is a picture, and a log is the worst place to read
      # one. This renders every screen the suite left behind into the job
      # summary, with SVG and HTML uploaded. It installs termlens-cli
      # itself, pinned to the version the lockfile names so the renderer and
      # the harness are one release.
      - uses: vyncint/termlens/.github/actions/report@b8af0fa457dd023aa708a493b7f485256009f1a5 # v0.11.0
        if: failure()
        with:
          cli-version: "0.11.0"
          name: termlens-report-ci-${{ matrix.os }}

  # The second configuration. Until 0.4.0 exactly one existed — every job
  # built the workspace defaults — so `--no-default-features` had never
  # been compiled, which is how a mandatory CUDA backend on macOS went
  # unnoticed for two releases. A feature nothing builds is a feature that
  # is already broken.
  no-default-features:
    name: no-default-features (cpu only)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy
      - name: Clippy
        run: cargo clippy -p oxmera -p oxmera-runtime --no-default-features --all-targets -- -D warnings
      - name: Test
        run: cargo test -p oxmera -p oxmera-runtime --no-default-features
      - name: The CUDA crates really are gone
        run: |
          set -euo pipefail
          tree=$(cargo tree -p oxmera --no-default-features -e normal --prefix none)
          # CUDA-only crates that must never appear with the default
          # features off. `ctor` joins them since 0.5.0: the Metal and CUDA
          # backends no longer register from a pre-main constructor, so no
          # crate in the workspace pulls `ctor` on any platform.
          for crate in cudarc libloading oxmera-cuda ctor; do
            if echo "$tree" | grep -qE "^${crate} "; then
              echo "::error::${crate} is still in the graph with --no-default-features"
              exit 1
            fi
          done
          echo "cudarc, libloading, oxmera-cuda and ctor are all absent"

  msrv:
    name: msrv (1.88, lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88"
      - name: MSRV check against the committed lockfile
        run: cargo +1.88 check --workspace --all-targets --locked

  # The vendored termlens skill is refreshed by hand, and a stale copy is
  # silent: every agent working in this repository is then handed guidance
  # for a version that is no longer the dev-dependency. Nothing can diff it
  # against upstream — the published crate does not ship the skill — but the
  # two versions agreeing is checkable, and that is the drift that happens.
  # The 0.9 copy taught `assert_screen_snapshot!(screen)` and `mouse_mode()`,
  # both of which 0.10 changed, and nothing here noticed.
  skill-version:
    name: skill version (vendored termlens skill)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: The vendored skill names the version we depend on
        run: ./.github/scripts/check-skill-version.sh

  firewall:
    name: firewall (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check bans licenses sources advisories

  # The published API cannot break incompatibly without the version saying
  # so. cargo-semver-checks compares the workspace against the last release
  # on crates.io; a 0.x minor bump is allowed to break, a patch is not.
  # Installed from the published crate (not a prebuilt binary), uncached.
  semver:
    name: semver-checks (public API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: The public API change matches the version bump
        run: cargo semver-checks --workspace
