# The main CI gate: format, clippy -D warnings, tests, docs as errors,
# MSRV against the committed lockfile, the dependency firewall, and the
# exercise ladder — on ubuntu and macos, with no GPU anywhere. Tier-2
# hardware is never touched from CI.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace
      - name: Docs are warning-free
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The second configuration. Until 0.4.0 exactly one existed — every job
  # built the workspace defaults — so `--no-default-features` had never
  # been compiled, which is how a mandatory CUDA backend on macOS went
  # unnoticed for two releases. A feature nothing builds is a feature that
  # is already broken.
  no-default-features:
    name: no-default-features (cpu only)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy
      - name: Clippy
        run: cargo clippy -p oxmera -p oxmera-runtime --no-default-features --all-targets -- -D warnings
      - name: Test
        run: cargo test -p oxmera -p oxmera-runtime --no-default-features
      - name: The CUDA crates really are gone
        run: |
          set -euo pipefail
          tree=$(cargo tree -p oxmera --no-default-features -e normal --prefix none)
          # Only the crates that are CUDA-only on EVERY platform. `ctor` is
          # not one of them: oxmera-metal registers at load time the same
          # way, so on macOS it stays in the graph and should — the first
          # version of this step listed it and failed the macOS leg while
          # the code was correct.
          for crate in cudarc libloading oxmera-cuda; do
            if echo "$tree" | grep -qE "^${crate} "; then
              echo "::error::${crate} is still in the graph with --no-default-features"
              exit 1
            fi
          done
          echo "cudarc, libloading and oxmera-cuda are all absent"

          # `ctor` on macOS belongs to Metal; anywhere else it could only
          # have come from CUDA, so check it where the answer is unambiguous.
          if [ "$RUNNER_OS" != "macOS" ] && echo "$tree" | grep -qE "^ctor "; then
            echo "::error::ctor is still in the graph, and off macOS only CUDA pulls it"
            exit 1
          fi

  msrv:
    name: msrv (1.88, lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88"
      - name: MSRV check against the committed lockfile
        run: cargo +1.88 check --workspace --all-targets --locked

  firewall:
    name: firewall (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check bans licenses sources advisories
