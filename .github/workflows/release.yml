# Tag-triggered, idempotent release: publishes every stable-workspace
# crate in dependency order and creates a GitHub Release.
#
# Auth: crates.io Trusted Publishing. `id-token: write` lets
# rust-lang/crates-io-auth-action mint a short-lived registry token from
# GitHub OIDC. Exception, per ADR-0005: Trusted Publishing cannot CREATE
# a crate, so when a release introduces a new crate the maintainer sets a
# temporary CARGO_REGISTRY_TOKEN secret — which, when present, overrides
# the OIDC token below — then deletes it and configures the new crate's
# trusted publisher. Steady state is secretless.
#
# The tag glob below is defense-in-depth only — in GitHub filter syntax
# `*` matches any characters, so v1.2.3-rc1 still triggers. The real
# guard is the job step that refuses to publish when "v$version" does not
# equal the tag.

name: release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to resume (e.g. v0.0.1)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write # OIDC for crates.io Trusted Publishing — this job only

jobs:
  publish:
    name: publish (ordered, resumable)
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: The real tag guard — version from the named package
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import sys, json; ps = json.load(sys.stdin)["packages"]; print(next(p["version"] for p in ps if p["name"] == "oxmera-core"))')
          echo "workspace version: $version, tag: $TAG"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::refusing to publish: tag $TAG does not match crate version v$version"
            exit 1
          fi

      - name: Verify the tree the tag points at
        run: cargo check --workspace --all-targets --locked

      - name: Mint a short-lived registry token from GitHub OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish every stable-workspace crate, in dependency order
        env:
          OIDC_TOKEN: ${{ steps.auth.outputs.token }}
          NEW_CRATE_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          ua="oxmera-release (github.com/${GITHUB_REPOSITORY})"
          crates="oxmera-core oxmera-tensor oxmera-ops oxmera-cpu oxmera-metal oxmera-cuda oxmera-runtime oxmera-autograd oxmera-nn oxmera-optim oxmera oxmera-cli"

          for crate in $crates; do
            # Skip versions already on the registry: that is what makes a
            # rate-limited run safely resumable via workflow_dispatch.
            # crates.io rejects requests without a User-Agent.
            if curl -sf -A "$ua" "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              echo "$crate $version is already on crates.io — skipping"
              continue
            fi
            # New crate (no versions at all): Trusted Publishing cannot
            # create it, so use the maintainer's temporary token. Existing
            # crate: its trusted publisher requires OIDC.
            if curl -sf -A "$ua" "https://crates.io/api/v1/crates/$crate" > /dev/null; then
              tok="$OIDC_TOKEN"
              echo "$crate exists — publishing via Trusted Publishing"
            else
              tok="$NEW_CRATE_TOKEN"
              if [ -z "$tok" ]; then
                echo "::error::$crate is a NEW crate and no CARGO_REGISTRY_TOKEN secret is set; see ADR-0005"
                exit 1
              fi
              echo "$crate is new — publishing with the temporary token"
            fi
            attempt=1
            while true; do
              echo "publishing $crate $version (attempt $attempt)"
              if out=$(CARGO_REGISTRY_TOKEN="$tok" cargo publish --locked -p "$crate" 2>&1); then
                printf '%s\n' "$out" | tail -2
                break
              fi
              printf '%s\n' "$out" | tail -5
              if printf '%s' "$out" | grep -qi "already uploaded"; then
                echo "$crate $version: already uploaded — treating as success"
                break
              fi
              if printf '%s' "$out" | grep -qiE "429|too many requests|rate limit"; then
                if [ "$attempt" -ge 8 ]; then
                  echo "::error::$crate: still rate-limited after $attempt attempts; resume later with workflow_dispatch"
                  exit 1
                fi
                echo "rate-limited; waiting 10 minutes before retrying $crate"
                sleep 600
                attempt=$((attempt + 1))
                continue
              fi
              # An existing crate without a trusted publisher configured
              # refuses OIDC with 403; fall back to the token once, if
              # there is one, rather than abandoning the release mid-list.
              if [ "$tok" = "$OIDC_TOKEN" ] && [ -n "$NEW_CRATE_TOKEN" ] \
                 && printf '%s' "$out" | grep -qiE "403|forbidden|trusted publish"; then
                echo "$crate: OIDC refused — retrying once with the registry token"
                tok="$NEW_CRATE_TOKEN"
                attempt=$((attempt + 1))
                continue
              fi
              echo "::error::$crate failed to publish for a non-retryable reason"
              exit 1
            done
          done

      - name: GitHub Release accompanies the tag
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
