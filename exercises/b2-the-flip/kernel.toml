# The space that makes the flip visible: 32 is one warp (a warp_id()==0
# guard is vacuously uniform), 64 is two (the same guard splits the block
# at a barrier — RC001).
[kernel]
name = "b2-the-flip"
entry = "reduce"
domain = 1
needs_cc = "7.5"
known = "flip"

[dims.block_x]
values = [32, 64]

[dims.tile]
role = "spec"
values = [128]

[constraints]
exprs = ["tile % block_x == 0"]

[bench]
elements = 1048576
grid_x = "elements / block_x"

[[bench.args]]
kind = "in_f32"
len = "elements"
[[bench.args]]
kind = "len_of"
of = 0
[[bench.args]]
kind = "out_f32"
len = "elements"
[[bench.args]]
kind = "len_of"
of = 2

[model]
smem_bytes = "tile * 4"
