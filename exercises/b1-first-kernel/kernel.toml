# Launch/specialization space for exercise B1. Elementwise, no shared
# memory, no barriers — every configuration should be admitted, and reading
# the space (`launchbound space` / `prune`) is exercise B4.
[kernel]
name = "b1-first-kernel"
entry = "vec_add"
domain = 1
needs_cc = "7.5"
known = "stable"

[dims.block_x]
values = [64, 128, 256]

[bench]
elements = 1048576
grid_x = "(elements + block_x - 1) / block_x"

# PTX ABI: &[f32] -> ptr,len; DisjointSlice<f32> -> ptr,len.
[[bench.args]]
kind = "in_f32"
len = "elements"
[[bench.args]]
kind = "len_of"
of = 0
[[bench.args]]
kind = "in_f32"
len = "elements"
[[bench.args]]
kind = "len_of"
of = 2
[[bench.args]]
kind = "out_f32"
len = "elements"
[[bench.args]]
kind = "len_of"
of = 4
