[package]
name = "oxmera-cuda-oxide"
description = "The cuda-oxide kernel crate for oxmera: elementwise grid-stride, staged warp-synchronous reductions, and double-buffered tiled GEMM. Deferred backend; verified by reconverge and pruned by launchbound, no GPU required."
publish = false
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vyncint/oxmera"
authors = ["Vyncint Ng <vyncint@icloud.com>"]

# Standalone on purpose: launchbound copies this crate into a scratch
# directory per tuning candidate, and a parent workspace would capture
# those copies and refuse to build them. The empty table keeps the crate
# (and every copy of it) self-contained.
[workspace]

[dependencies]
# The four-pin contract (CONTRIBUTING.md): this rev is what reconverge
# 0.5.0 records as verified, on nightly-2026-04-03. `cuda-device` is the
# only dependency kernels need; the host-side crates (cuda-core et al.)
# require a CUDA toolkit and cannot build on macOS, so they stay out of
# the graph until a host runtime exists to use them.
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide", rev = "a766fc26" }
# Host runtime, only behind `hardware`: these need a CUDA toolkit to build
# and a device to run, so the default (toolkit-free) graph never sees them.
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide", rev = "a766fc26", optional = true }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide", rev = "a766fc26", optional = true }

[features]
# Enables the on-device parity harness (`src/bin/parity.rs`). Run on a box
# with a GPU: `cargo oxide run --features hardware --bin parity`.
hardware = ["dep:cuda-core", "dep:cuda-host"]

[[bin]]
name = "parity"
path = "src/bin/parity.rs"
required-features = ["hardware"]
doc = false
